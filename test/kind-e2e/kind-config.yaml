# kind cluster configuration for E2E testing
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: e2bgateway-e2e
nodes:
  - role: control-plane
    extraPortMappings:
      # E2BGateway HTTP
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # E2BGateway Metrics
      - containerPort: 30090
        hostPort: 9090
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Increase resource limits for sandbox pods
    extraMounts:
      - hostPath: /tmp
        containerPath: /tmp
        readOnly: false
