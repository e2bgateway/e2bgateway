# OpenSandbox mock lifecycle API for kind E2E testing.
# Implements the same wire protocol as the real OpenSandbox Lifecycle API
# (github.com/alibaba/OpenSandbox/sdks/sandbox/go) so the gateway's
# opensandbox adapter can talk to it without code changes.
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensandbox-controller
  namespace: sandbox-system
  labels:
    app: opensandbox-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensandbox-controller
  template:
    metadata:
      labels:
        app: opensandbox-controller
    spec:
      containers:
        - name: controller
          image: python:3.11-slim
          command: ["python3", "-c"]
          args:
            - |
              import http.server
              import json
              import uuid
              import datetime

              sandboxes = {}

              def sandbox_info(sid, image_uri="sandbox-with-envd:local", state="Running"):
                  return {
                      "id": sid,
                      "image": {"uri": image_uri},
                      "status": {"state": state},
                      "createdAt": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "entrypoint": ["tail", "-f", "/dev/null"],
                      "metadata": {},
                  }

              class Handler(http.server.BaseHTTPRequestHandler):
                  def _send_json(self, code, obj):
                      body = json.dumps(obj).encode()
                      self.send_response(code)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

                  def _strip_v1(self, path):
                      """Strip /v1 prefix from path."""
                      if path.startswith("/v1"):
                          return path[3:]
                      return path

                  def do_GET(self):
                      path = self._strip_v1(self.path.split("?")[0])

                      if path == "/healthz":
                          self._send_json(200, {"status": "ok"})
                          return

                      if path == "/sandboxes":
                          items = [sandbox_info(sid, info.get("image", "sandbox-with-envd:local"), info.get("state", "Running"))
                                   for sid, info in sandboxes.items()]
                          self._send_json(200, {
                              "items": items,
                              "pagination": {"page": 1, "pageSize": 20, "total": len(items)},
                          })
                          return

                      # GET /sandboxes/{id}
                      if path.startswith("/sandboxes/") and "/endpoints/" not in path:
                          sid = path.split("/")[2]
                          if sid in sandboxes:
                              info = sandboxes[sid]
                              self._send_json(200, sandbox_info(sid, info.get("image", "sandbox-with-envd:local"), info.get("state", "Running")))
                          else:
                              self._send_json(404, {"error": "sandbox not found"})
                          return

                      # GET /sandboxes/{id}/endpoints/{port}
                      if "/endpoints/" in path:
                          parts = path.split("/")
                          sid = parts[2]
                          port = parts[4]
                          if sid in sandboxes:
                              # Return a mock endpoint — the adapter uses server proxy mode
                              # so the endpoint is relative to the server.
                              self._send_json(200, {
                                  "endpoint": f"http://opensandbox-controller.sandbox-system:8080/v1/sandboxes/{sid}/proxy/{port}",
                              })
                          else:
                              self._send_json(404, {"error": "sandbox not found"})
                          return

                      self._send_json(404, {"error": "not found"})

                  def do_POST(self):
                      path = self._strip_v1(self.path.split("?")[0])
                      length = int(self.headers.get("Content-Length", 0))
                      body = json.loads(self.rfile.read(length)) if length > 0 else {}

                      # POST /sandboxes — create
                      if path == "/sandboxes":
                          sid = f"osbx-{uuid.uuid4().hex[:8]}"
                          image_uri = body.get("image", {}).get("uri", "sandbox-with-envd:local")
                          sandboxes[sid] = {"image": image_uri, "state": "Running"}
                          self._send_json(200, sandbox_info(sid, image_uri, "Running"))
                          return

                      # POST /sandboxes/{id}/pause
                      if "/pause" in path:
                          sid = path.split("/")[2]
                          if sid in sandboxes:
                              sandboxes[sid]["state"] = "Paused"
                          self._send_json(200, {})
                          return

                      # POST /sandboxes/{id}/resume
                      if "/resume" in path:
                          sid = path.split("/")[2]
                          if sid in sandboxes:
                              sandboxes[sid]["state"] = "Running"
                          self._send_json(200, {})
                          return

                      # POST /sandboxes/{id}/renew-expiration
                      if "/renew-expiration" in path:
                          self._send_json(200, {})
                          return

                      self._send_json(404, {"error": "not found"})

                  def do_DELETE(self):
                      path = self._strip_v1(self.path.split("?")[0])
                      if path.startswith("/sandboxes/"):
                          sid = path.split("/")[2]
                          sandboxes.pop(sid, None)
                      self._send_json(200, {})

                  def log_message(self, format, *args):
                      pass

              server = http.server.HTTPServer(("0.0.0.0", 8080), Handler)
              print("OpenSandbox mock lifecycle API starting on :8080")
              server.serve_forever()
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: opensandbox-controller
  namespace: sandbox-system
spec:
  selector:
    app: opensandbox-controller
  ports:
    - port: 8080
      targetPort: 8080
