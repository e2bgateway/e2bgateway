# OpenSandbox mock lifecycle + execd API for kind E2E testing.
# Implements the same wire protocol as the real OpenSandbox Lifecycle API
# (github.com/alibaba/OpenSandbox/sdks/sandbox/go) so the gateway's
# opensandbox adapter can talk to it without code changes.
#
# Lifecycle API: create/get/list/delete/pause/resume sandboxes + endpoints
# Execd API: commands, file operations via /sandboxes/{id}/proxy/{port}/...
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensandbox-controller
  namespace: sandbox-system
  labels:
    app: opensandbox-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensandbox-controller
  template:
    metadata:
      labels:
        app: opensandbox-controller
    spec:
      containers:
        - name: controller
          image: python:3.11-slim
          command: ["python3", "-c"]
          args:
            - |
              import http.server
              import json
              import uuid
              import datetime
              import subprocess
              import os
              import shutil
              import tempfile
              import urllib.parse

              sandboxes = {}
              # In-memory file store for file operations (simulates sandbox filesystem)
              file_store = {}  # path -> content (bytes)

              def sandbox_info(sid, image_uri="sandbox-with-envd:local", state="Running"):
                  return {
                      "id": sid,
                      "image": {"uri": image_uri},
                      "status": {"state": state},
                      "createdAt": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "entrypoint": ["tail", "-f", "/dev/null"],
                      "metadata": {},
                  }

              class Handler(http.server.BaseHTTPRequestHandler):
                  def _send_json(self, code, obj):
                      body = json.dumps(obj).encode()
                      self.send_response(code)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

                  def _send_sse(self, code, events):
                      """Send SSE stream with NDJSON events."""
                      self.send_response(code)
                      self.send_header("Content-Type", "text/event-stream")
                      self.send_header("Cache-Control", "no-cache")
                      self.end_headers()
                      for event in events:
                          line = json.dumps(event) + "\n"
                          self.wfile.write(line.encode())
                          self.wfile.flush()
                      # End with empty line
                      self.wfile.write(b"\n")
                      self.wfile.flush()

                  def _send_raw(self, code, content_type, data):
                      self.send_response(code)
                      self.send_header("Content-Type", content_type)
                      self.send_header("Content-Length", str(len(data)))
                      self.end_headers()
                      self.wfile.write(data)

                  def _read_body(self):
                      length = int(self.headers.get("Content-Length", 0))
                      if length > 0:
                          return self.rfile.read(length)
                      return b""

                  def _strip_v1(self, path):
                      """Strip /v1 prefix from path."""
                      if path.startswith("/v1"):
                          return path[3:]
                      return path

                  def _parse_proxy_path(self, path):
                      """Parse /sandboxes/{id}/proxy/{port}/{rest} and return (sid, port, rest)."""
                      parts = path.split("/")
                      # Expected: ['', 'sandboxes', '{id}', 'proxy', '{port}', ...rest]
                      if len(parts) < 5:
                          return None, None, None
                      sid = parts[2]
                      port = parts[4]
                      rest = "/" + "/".join(parts[5:]) if len(parts) > 5 else "/"
                      return sid, port, rest

                  # ─── Lifecycle API handlers ──────────────────────────────

                  def _handle_get_endpoint(self, path):
                      """GET /sandboxes/{id}/endpoints/{port}?use_server_proxy=true"""
                      parts = path.split("/")
                      sid = parts[2]
                      port = parts[4]
                      if sid not in sandboxes:
                          self._send_json(404, {"error": "sandbox not found"})
                          return
                      # Return endpoint URL pointing to our own proxy routes
                      endpoint = f"http://opensandbox-controller.sandbox-system:8080/v1/sandboxes/{sid}/proxy/{port}"
                      self._send_json(200, {"endpoint": endpoint, "headers": {}})

                  def _handle_lifecycle_get(self, path):
                      if path == "/healthz":
                          self._send_json(200, {"status": "ok"})
                          return

                      if path == "/sandboxes":
                          items = [sandbox_info(sid, info.get("image", "sandbox-with-envd:local"), info.get("state", "Running"))
                                   for sid, info in sandboxes.items()]
                          self._send_json(200, {
                              "items": items,
                              "pagination": {"page": 1, "pageSize": 20, "total": len(items)},
                          })
                          return

                      # GET /sandboxes/{id}/endpoints/{port}
                      if path.startswith("/sandboxes/") and "/endpoints/" in path:
                          self._handle_get_endpoint(path)
                          return

                      # GET /sandboxes/{id}
                      if path.startswith("/sandboxes/"):
                          sid = path.split("/")[2]
                          if sid in sandboxes:
                              info = sandboxes[sid]
                              self._send_json(200, sandbox_info(sid, info.get("image", "sandbox-with-envd:local"), info.get("state", "Running")))
                          else:
                              self._send_json(404, {"error": "sandbox not found"})
                          return

                      self._send_json(404, {"error": "not found"})

                  def _handle_lifecycle_post(self, path, body):
                      # POST /sandboxes — create
                      if path == "/sandboxes":
                          sid = f"osbx-{uuid.uuid4().hex[:8]}"
                          image_uri = body.get("image", {}).get("uri", "sandbox-with-envd:local")
                          sandboxes[sid] = {"image": image_uri, "state": "Running"}
                          self._send_json(200, sandbox_info(sid, image_uri, "Running"))
                          return

                      # POST /sandboxes/{id}/pause
                      if "/pause" in path:
                          sid = path.split("/")[2]
                          if sid in sandboxes:
                              sandboxes[sid]["state"] = "Paused"
                          self._send_json(200, {})
                          return

                      # POST /sandboxes/{id}/resume
                      if "/resume" in path:
                          sid = path.split("/")[2]
                          if sid in sandboxes:
                              sandboxes[sid]["state"] = "Running"
                          self._send_json(200, {})
                          return

                      # POST /sandboxes/{id}/renew-expiration
                      if "/renew-expiration" in path:
                          self._send_json(200, {})
                          return

                      self._send_json(404, {"error": "not found"})

                  # ─── Execd API handlers (via proxy routes) ────────────────

                  def _handle_execd_command(self, body_bytes):
                      """POST /proxy/{port}/command — run shell command, return SSE stream."""
                      try:
                          req = json.loads(body_bytes) if body_bytes else {}
                      except json.JSONDecodeError:
                          req = {}
                      command = req.get("command", "true")

                      try:
                          result = subprocess.run(
                              command, shell=True, capture_output=True, timeout=30,
                              cwd="/tmp"
                          )
                          events = []
                          stdout_text = result.stdout.decode("utf-8", errors="replace")
                          stderr_text = result.stderr.decode("utf-8", errors="replace")
                          if stdout_text:
                              events.append({"type": "stdout", "text": stdout_text})
                          if stderr_text:
                              events.append({"type": "stderr", "text": stderr_text})
                          if not events:
                              events.append({"type": "stdout", "text": ""})
                          self._send_sse(200, events)
                      except subprocess.TimeoutExpired:
                          self._send_sse(200, [{"type": "stderr", "text": "command timed out"}])
                      except Exception as e:
                          self._send_sse(200, [{"type": "stderr", "text": str(e)}])

                  def _handle_execd_download(self, query):
                      """GET /proxy/{port}/files/download?path=..."""
                      params = urllib.parse.parse_qs(query)
                      path = params.get("path", [""])[0]
                      if not path:
                          self._send_json(400, {"error": "path required"})
                          return

                      # Check in-memory store first, then real filesystem
                      if path in file_store:
                          content = file_store[path]
                          if isinstance(content, str):
                              content = content.encode("utf-8")
                          self._send_raw(200, "application/octet-stream", content)
                      elif os.path.exists(path):
                          with open(path, "rb") as f:
                              self._send_raw(200, "application/octet-stream", f.read())
                      else:
                          self._send_json(404, {"error": f"file not found: {path}"})

                  def _handle_execd_upload(self):
                      """POST /proxy/{port}/files/upload — multipart upload."""
                      content_type = self.headers.get("Content-Type", "")

                      # Check query string for path parameter first
                      path_from_query = None
                      if "?" in self.path:
                          query = self.path.split("?", 1)[1]
                          params = urllib.parse.parse_qs(query)
                          if "path" in params:
                              path_from_query = params["path"][0]

                      if "multipart" not in content_type:
                          # If not multipart, treat entire body as file content
                          body = self._read_body()
                          file_path = path_from_query or "/tmp/uploaded_file"
                          file_store[file_path] = body
                          try:
                              import os
                              os.makedirs(os.path.dirname(file_path), exist_ok=True)
                              with open(file_path, "wb") as f:
                                  f.write(body if isinstance(body, bytes) else body.encode("utf-8"))
                          except Exception:
                              pass
                          self._send_json(200, {})
                          return

                      # Parse multipart manually (simple implementation)
                      boundary = None
                      for part in content_type.split(";"):
                          part = part.strip()
                          if part.startswith("boundary="):
                              boundary = part[len("boundary="):].strip('"')
                              break

                      if not boundary:
                          self._send_json(400, {"error": "boundary not found"})
                          return

                      body = self._read_body()
                      # Split by boundary - handle both \r\n and \n line endings
                      parts = body.decode("latin-1").split("--" + boundary)

                      # First pass: collect all metadata and file parts
                      metadata = {}
                      file_content = None
                      filename_from_disposition = None
                      all_part_bodies = []  # Track all part bodies for fallback

                      for part in parts:
                          if not part.strip() or part.strip() == "--":
                              continue

                          # Remove leading \r\n or \n
                          if part.startswith("\r\n"):
                              part = part[2:]
                          elif part.startswith("\n"):
                              part = part[1:]

                          # Split headers and body
                          if "\r\n\r\n" in part:
                              header_section, part_body = part.split("\r\n\r\n", 1)
                          elif "\n\n" in part:
                              header_section, part_body = part.split("\n\n", 1)
                          else:
                              continue

                          # Remove trailing boundary markers
                          part_body = part_body.rstrip("\r\n")
                          if part_body.endswith("--"):
                              part_body = part_body[:-2].rstrip("\r\n")

                          # Track all non-empty part bodies for fallback
                          if part_body.strip():
                              all_part_bodies.append(part_body)

                          # Extract filename from Content-Disposition if present
                          import re
                          # Handle both filename="..." and filename=... formats
                          filename_match = re.search(r'filename="?([^";\r\n]+)"?', header_section)
                          if filename_match:
                              filename_from_disposition = filename_match.group(1).strip()

                          # Check for metadata part
                          if 'name="metadata"' in header_section:
                              try:
                                  metadata = json.loads(part_body)
                              except json.JSONDecodeError:
                                  # Try to extract path from form field
                                  path_match = re.search(r'"path"\s*:\s*"([^"]+)"', part_body)
                                  if path_match:
                                      metadata["path"] = path_match.group(1)
                          # Check for file part
                          elif 'name="file"' in header_section:
                              file_content = part_body
                          # Check for path in form field (alternative format)
                          elif 'name="path"' in header_section:
                              metadata["path"] = part_body.strip()
                          # If no name attribute, treat as file content
                          elif 'Content-Disposition' in header_section and 'name=' not in header_section:
                              if file_content is None:
                                  file_content = part_body

                      # Fallback: if no file content found, use the largest non-metadata part body
                      if file_content is None and all_part_bodies:
                          # Filter out parts that look like metadata or paths
                          candidates = [b for b in all_part_bodies if not b.strip().startswith('{') and not b.strip().startswith('/')]
                          if candidates:
                              # Use the largest candidate as file content
                              file_content = max(candidates, key=len)
                          else:
                              # Last resort: use any non-empty part body
                              non_empty = [b for b in all_part_bodies if b.strip()]
                              if non_empty:
                                  file_content = max(non_empty, key=len)

                      # Final fallback: if still no file content, use the raw body (minus boundaries)
                      if file_content is None:
                          # Try to extract file content from raw body by removing boundary markers
                          raw_content = body.decode("latin-1")
                          # Remove all boundary markers
                          import re
                          raw_content = re.sub(r'--' + re.escape(boundary) + r'--?\r?\n?', '', raw_content)
                          # Remove empty lines and headers
                          lines = [l for l in raw_content.split('\n') if l.strip() and not l.strip().startswith('Content-') and not l.strip().startswith('boundary=')]
                          if lines:
                              # Use the last non-empty line as file content (likely the file content)
                              file_content = lines[-1].strip()

                      # Determine the file path - try multiple sources
                      file_path = metadata.get("path")
                      if not file_path and path_from_query:
                          file_path = path_from_query
                      if not file_path and filename_from_disposition:
                          file_path = filename_from_disposition

                      # If still no path, try to extract from any part body that looks like a path
                      if not file_path:
                          for part in parts:
                              if not part.strip() or part.strip() == "--":
                                  continue
                              if "\r\n\r\n" in part:
                                  _, part_body = part.split("\r\n\r\n", 1)
                              elif "\n\n" in part:
                                  _, part_body = part.split("\n\n", 1)
                              else:
                                  continue
                              part_body = part_body.strip()
                              if part_body.startswith("/") and len(part_body) < 256:
                                  file_path = part_body
                                  break

                      if not file_path:
                          file_path = "/tmp/uploaded_file"

                      # Store the file only if we have content
                      if file_content is not None and len(file_content) > 0:
                          file_store[file_path] = file_content
                          # Also write to actual filesystem for persistence
                          try:
                              import os
                              os.makedirs(os.path.dirname(file_path), exist_ok=True)
                              with open(file_path, "wb") as f:
                                  if isinstance(file_content, str):
                                      f.write(file_content.encode("utf-8"))
                                  else:
                                      f.write(file_content)
                          except Exception:
                              pass  # Ignore filesystem errors, file_store is the source of truth

                      self._send_json(200, {})

                  def _handle_execd_list_dir(self, query):
                      """GET /proxy/{port}/directories/list?path=..."""
                      params = urllib.parse.parse_qs(query)
                      path = params.get("path", ["/tmp"])[0]

                      entries = []
                      # List real filesystem
                      target = path if os.path.isdir(path) else "/tmp"
                      if os.path.isdir(target):
                          try:
                              for name in sorted(os.listdir(target)):
                                  full = os.path.join(target, name)
                                  is_dir = os.path.isdir(full)
                                  size = os.path.getsize(full) if os.path.isfile(full) else 0
                                  entries.append({
                                      "path": os.path.join(target, name),
                                      "name": name,
                                      "type": "directory" if is_dir else "file",
                                      "size": size,
                                  })
                          except PermissionError:
                              pass

                      # Also include in-memory files under this path
                      for fp in file_store:
                          if fp.startswith(target + "/") or (target == "/" and fp.startswith("/")):
                              fname = fp.split("/")[-1]
                              if not any(e["name"] == fname for e in entries):
                                  entries.append({
                                      "path": fp,
                                      "name": fname,
                                      "type": "file",
                                      "size": len(file_store[fp]) if isinstance(file_store[fp], (bytes, str)) else 0,
                                  })

                      self._send_json(200, entries)

                  def _handle_execd_create_dir(self, body_bytes):
                      """POST /proxy/{port}/directories — create directory."""
                      try:
                          req = json.loads(body_bytes) if body_bytes else {}
                      except json.JSONDecodeError:
                          req = {}
                      # Body format: {path: {mode: 755}}
                      for path in req:
                          os.makedirs(path, exist_ok=True)
                      self._send_json(200, {})

                  def _handle_execd_delete_files(self, query):
                      """DELETE /proxy/{port}/files?path=..."""
                      params = urllib.parse.parse_qs(query)
                      paths = params.get("path", [])
                      for p in paths:
                          file_store.pop(p, None)
                          if os.path.exists(p):
                              try:
                                  os.remove(p)
                              except OSError:
                                  pass
                      self._send_json(200, {})

                  def _handle_execd_move_files(self, body_bytes):
                      """POST /proxy/{port}/files/mv"""
                      try:
                          req = json.loads(body_bytes) if body_bytes else {}
                      except json.JSONDecodeError:
                          req = {}
                      moves = req.get("moves", req.get("items", []))
                      if isinstance(moves, list):
                          for m in moves:
                              src = m.get("source", m.get("src", ""))
                              dst = m.get("destination", m.get("dest", m.get("dst", "")))
                              if src in file_store:
                                  file_store[dst] = file_store.pop(src)
                              elif os.path.exists(src):
                                  os.makedirs(os.path.dirname(dst), exist_ok=True)
                                  shutil.move(src, dst)
                      self._send_json(200, {})

                  def _handle_execd_ping(self):
                      """GET /proxy/{port}/ping"""
                      self._send_json(200, {"status": "ok"})

                  def _handle_proxy(self, path, method, query):
                      """Route to the correct Execd API handler based on path and method."""
                      sid, port, rest = self._parse_proxy_path(path)
                      if not sid:
                          self._send_json(404, {"error": "invalid proxy path"})
                          return
                      if sid not in sandboxes:
                          self._send_json(404, {"error": "sandbox not found"})
                          return

                      body_bytes = self._read_body() if method in ("POST", "PUT", "PATCH") else b""

                      # Route to Execd API handlers
                      if method == "POST" and rest.startswith("/command"):
                          self._handle_execd_command(body_bytes)
                      elif method == "GET" and rest.startswith("/files/download"):
                          self._handle_execd_download(query)
                      elif method == "POST" and rest.startswith("/files/upload"):
                          self._handle_execd_upload()
                      elif method == "GET" and rest.startswith("/directories/list"):
                          self._handle_execd_list_dir(query)
                      elif method == "POST" and rest.startswith("/directories"):
                          self._handle_execd_create_dir(body_bytes)
                      elif method == "DELETE" and rest.startswith("/files"):
                          self._handle_execd_delete_files(query)
                      elif method == "POST" and rest.startswith("/files/mv"):
                          self._handle_execd_move_files(body_bytes)
                      elif method == "GET" and rest.startswith("/ping"):
                          self._handle_execd_ping()
                      else:
                          self._send_json(404, {"error": f"unknown execd route: {method} {rest}"})

                  # ─── HTTP method dispatchers ──────────────────────────────

                  def do_GET(self):
                      raw_path = self.path
                      query = ""
                      if "?" in raw_path:
                          raw_path, query = raw_path.split("?", 1)
                      path = self._strip_v1(raw_path)

                      # Proxy route: /sandboxes/{id}/proxy/{port}/...
                      if path.startswith("/sandboxes/") and "/proxy/" in path:
                          self._handle_proxy(path, "GET", query)
                          return

                      self._handle_lifecycle_get(path)

                  def do_POST(self):
                      raw_path = self.path
                      if "?" in raw_path:
                          raw_path = raw_path.split("?")[0]
                      path = self._strip_v1(raw_path)

                      # Proxy route: /sandboxes/{id}/proxy/{port}/...
                      if path.startswith("/sandboxes/") and "/proxy/" in path:
                          self._handle_proxy(path, "POST", "")
                          return

                      body_bytes = self._read_body()
                      try:
                          body = json.loads(body_bytes) if body_bytes else {}
                      except json.JSONDecodeError:
                          body = {}
                      self._handle_lifecycle_post(path, body)

                  def do_DELETE(self):
                      raw_path = self.path
                      query = ""
                      if "?" in raw_path:
                          raw_path, query = raw_path.split("?", 1)
                      path = self._strip_v1(raw_path)

                      # Proxy route: /sandboxes/{id}/proxy/{port}/...
                      if path.startswith("/sandboxes/") and "/proxy/" in path:
                          self._handle_proxy(path, "DELETE", query)
                          return

                      if path.startswith("/sandboxes/"):
                          sid = path.split("/")[2]
                          sandboxes.pop(sid, None)
                      self._send_json(200, {})

                  def do_PUT(self):
                      raw_path = self.path
                      if "?" in raw_path:
                          raw_path = raw_path.split("?")[0]
                      path = self._strip_v1(raw_path)

                      if path.startswith("/sandboxes/") and "/proxy/" in path:
                          self._handle_proxy(path, "PUT", "")
                          return

                      self._send_json(404, {"error": "not found"})

                  def log_message(self, format, *args):
                      pass

              server = http.server.HTTPServer(("0.0.0.0", 8080), Handler)
              print("OpenSandbox mock lifecycle + execd API starting on :8080")
              server.serve_forever()
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: opensandbox-controller
  namespace: sandbox-system
spec:
  selector:
    app: opensandbox-controller
  ports:
    - port: 8080
      targetPort: 8080
