version: "2"
run:
  go: "1.26"
  timeout: 10m
  modules-download-mode: readonly
  allow-parallel-runners: true
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - depguard
    - dogsled
    - dupl
    - errcheck
    - errchkjson
    - errorlint
    - exptostd
    - exhaustive
    - ginkgolinter
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godoclint
    - goheader
    - goprintffuncname
    - govet
    - iface
    - importas
    - ineffassign
    - iotamixing
    - makezero
    - misspell
    - modernize
    - nakedret
    - nilerr
    - nilnesserr
    - nolintlint
    - prealloc
    - promlinter
    - reassign
    - recvcheck
    - revive
    - sloglint
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        forbid-pkg-errors:
          deny:
            - pkg: github.com/pkg/errors
              desc: Should be replaced with standard lib errors or fmt.Errorf
            - pkg: sort
              desc: Should be replaced with slices package
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        # Any error in HTTP handlers is handled by the server itself.
        - (net/http.ResponseWriter).Write
    gocyclo:
      min-complexity: 15
    goconst:
      min-occurrences: 3
    govet:
      disable:
        - fieldalignment
        - shadow
    goheader:
      values:
        const:
          COMPANY: The E2BGateway Authors
      template: |-
        Copyright {{ COMPANY }}

        Licensed under the Apache License, Version 2.0 (the "License");
        you may not use this file except in compliance with the License.
        You may obtain a copy of the License at

            http://www.apache.org/licenses/LICENSE-2.0

        Unless required by applicable law or agreed to in writing, software
        distributed under the License is distributed on an "AS IS" BASIS,
        WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
        See the License for the specific language governing permissions and
        limitations under the License.
    importas:
      alias:
        # Kubernetes
        - pkg: k8s.io/apimachinery/pkg/apis/meta/v1
          alias: metav1
        - pkg: k8s.io/apimachinery/pkg/api/errors
          alias: apierrors
        - pkg: k8s.io/client-go/kubernetes/typed/core/v1
          alias: typedcorev1
        # agent-sandbox
        - pkg: sigs.k8s.io/agent-sandbox/extensions/api/v1beta1
          alias: extv1beta1
        # E2BGateway internal
        - pkg: github.com/e2bgateway/e2bgateway/internal/adapter/agentsandbox
          alias: agentsandboxadapter
        - pkg: github.com/e2bgateway/e2bgateway/internal/adapter/e2bcloud
          alias: e2bcloudadapter
        - pkg: github.com/e2bgateway/e2bgateway/internal/adapter/opensandbox
          alias: opensandboxadapter
        - pkg: github.com/e2bgateway/e2bgateway/internal/server/middleware
          alias: gwmiddleware
        - pkg: github.com/e2bgateway/e2bgateway/internal/api/v1
          alias: v1
        - pkg: github.com/e2bgateway/e2bgateway/test/mock
          alias: testmock
    misspell:
      mode: default
    modernize:
      disable:
        - omitzero
    nakedret:
      max-func-lines: 30
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    revive:
      confidence: 0.8
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
    staticcheck:
      checks:
        - all
    unparam:
      check-exported: false
    whitespace:
      multi-if: false
      multi-func: false
  exclusions:
    generated: strict
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - goconst
          - gocritic
          - gocyclo
          - gosec
          - unparam
          - bodyclose
        path: _test\.go
      - linters:
          - errcheck
          - staticcheck
          - testifylint
          - revive
          - errchkjson
          - errorlint
        path: _test.go
      - linters:
          - revive
        text: 'exported:'
      - linters:
          - lll
        source: https?://
    paths:
      - zz_generated.*\.go$
      - third_party$
      - builtin$
      - examples$
      - examples/
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/e2bgateway/e2bgateway)
    gofmt:
      simplify: true
  exclusions:
    generated: strict
    paths:
      - zz_generated.*\.go$
      - third_party$
      - builtin$
      - examples$
      - examples/
