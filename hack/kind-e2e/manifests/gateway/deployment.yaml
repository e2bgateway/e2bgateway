# E2BGateway deployment for kind E2E testing
apiVersion: v1
kind: Namespace
metadata:
  name: e2bgateway-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: e2bgateway-config
  namespace: e2bgateway-system
data:
  config.yaml: |
    server:
      http:
        address: "0.0.0.0:8080"
        readTimeout: 30s
        writeTimeout: 300s
        idleTimeout: 120s
    auth:
      providers:
        - type: apikey
          keys:
            - "test-key"
    rateLimit:
      enabled: false
    backends:
      - name: opensandbox
        type: opensandbox
        enabled: true
        config:
          baseURL: "http://host.docker.internal:8091"
    routing:
      strategy: static
      defaultBackend: opensandbox
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2bgateway
  namespace: e2bgateway-system
  labels:
    app: e2bgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e2bgateway
  template:
    metadata:
      labels:
        app: e2bgateway
    spec:
      containers:
        - name: e2bgateway
          image: e2bgateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/e2bgateway
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          configMap:
            name: e2bgateway-config
      serviceAccountName: e2bgateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2bgateway
  namespace: e2bgateway-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2bgateway
subjects:
  - kind: ServiceAccount
    name: e2bgateway
    namespace: e2bgateway-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: e2bgateway
  namespace: e2bgateway-system
spec:
  type: NodePort
  selector:
    app: e2bgateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
    - name: metrics
      port: 9090
      targetPort: metrics
      nodePort: 30090
