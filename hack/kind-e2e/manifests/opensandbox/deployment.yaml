apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensandbox-controller
  namespace: sandbox-system
  labels:
    app: opensandbox-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensandbox-controller
  template:
    metadata:
      labels:
        app: opensandbox-controller
    spec:
      containers:
        - name: controller
          image: python:3.11-slim
          command: ["python3", "/app/controller.py"]
          volumeMounts:
            - name: script
              mountPath: /app
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: script
          configMap:
            name: opensandbox-controller-script
---
apiVersion: v1
kind: Service
metadata:
  name: opensandbox-controller
  namespace: sandbox-system
spec:
  selector:
    app: opensandbox-controller
  ports:
    - port: 8080
      targetPort: 8080
