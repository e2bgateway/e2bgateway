# E2BGateway Example Configuration
# Demonstrates all features with multiple backends

server:
  http:
    address: "0.0.0.0:8080"
    readTimeout: 30s
    writeTimeout: 300s
    idleTimeout: 120s
  https:
    address: "0.0.0.0:8443"
    certFile: "/etc/e2bgw/certs/tls.crt"
    keyFile: "/etc/e2bgw/certs/tls.key"

backends:
  - name: e2b-cloud
    type: e2b-cloud
    enabled: true
    config:
      endpoint: "https://api.e2b.dev"
      apiKeyRef: "secret/e2b-cloud-api-key"
      timeout: 60s
      maxRetries: 3
      pool:
        maxIdleConns: 100
        maxIdleConnsPerHost: 50
        idleConnTimeout: 90s

  - name: agent-sandbox
    type: agent-sandbox
    enabled: true
    config:
      kubeconfig: ""
      namespace: "sandbox-system"
      sandboxClass: "default"
      defaultTemplate: "code-interpreter"
      timeout: 120s
      # Annotation key for E2B sandbox ID mapping
      sandboxIDAnnotation: "e2b.e2bgateway.io/sandbox-id"
      # Warm Pool CRUD: manages SandboxWarmPool CRDs in the namespace above.
      warmPoolUpdateStrategy: OnReplenish     # OnReplenish (CRD default) | Recreate
      maxWarmPoolSize: 256                    # caps targetSize for CRUD
      # Optional: E2B template ID → SandboxTemplate resource name.
      # When absent, the template ID is used as the SandboxTemplate name and
      # must already exist in the namespace (CreateWarmPool validates this).
      # templateToSandboxTemplate:
      #   my-e2b-template: my-sandbox-template

  - name: opensandbox
    type: opensandbox
    enabled: true
    config:
      endpoint: "http://opensandbox-runtime:8080"
      timeout: 60s
      pool:
        maxIdleConns: 50
        maxIdleConnsPerHost: 25
      # Access token mode (hybrid approach):
      # false (default): gateway generates envd_{id}_{random} tokens
      # true: use OpenSandbox server's OSEP-0011 signed endpoints
      useSignedEndpoint: false
      # Template store (pluggable persistence for template/build/alias/tag metadata):
      # - "memory" (default): in-process, zero-dep, data lost on restart
      # - "redis": persistent, shared across gateway instances
      # Interface-based: etcd or other KV stores can be added by implementing TemplateStore
      templateStore:
        type: memory                          # memory | redis
        # Redis config (only when type: redis):
        # addr: "redis:6379"
        # password: ""
        # db: 0
        # keyPrefix: "e2bgateway:opensandbox:"
        # dialTimeout: "5s"
        # readTimeout: "3s"
        # writeTimeout: "3s"
      # Warm Pool CRUD: in-process SDK pools. CreateSandbox automatically
      # acquires from a pool when one serves the requested template, falling
      # back to direct creation (requests carrying envs/metadata always go
      # direct). Pool images resolve strictly: templateToImage → template
      # store → alias; an unmapped templateID is rejected (never used raw as
      # the image). NOTE: the "pool" key above is legacy HTTP connection
      # pooling and unrelated.
      warmPool:
        maxWarmPoolSize: 256                  # caps targetSize for CRUD
        # idleTimeout: 24h                    # TTL for pool-created sandboxes (SDK default 24h)
        stateStore:
          type: memory                        # memory | redis
          # Redis config (only when type: redis) — keeps idle sandbox records
          # across gateway restarts (pool definitions remain in-process):
          # addr: "redis:6379"
          # password: ""
          # db: 0
          # keyPrefix: "opensandbox:pool"

auth:
  providers:
    - type: apikey
      secretRef: "e2bgw-api-keys"
      headerName: "X-API-Key"
      alternateHeader: "Authorization"
      bearerPrefix: true
    # Optional static JWT provider. Replace the public key fields before enabling.
    # - type: jwt
    #   issuer: "https://auth.example.com"
    #   audience: "e2bgateway"
    #   clockSkew: 5s
    #   jwks: '{"keys":[{"kty":"RSA","kid":"your-key-id","alg":"RS256","use":"sig","n":"PUBLIC_BASE64URL_MODULUS","e":"AQAB"}]}'
    # JWTs must use RS256 or ES256 and include sub, aud, iss, exp.
    # The scope claim is space-separated, for example: sandbox:read sandbox:write.

rateLimit:
  enabled: true
  backend: redis
  defaultLimit:
    requestsPerMinute: 200
    burstSize: 50
  redis:
    address: "redis:6379"
    password: ""
    db: 0
  # Per-tenant overrides
  tenantOverrides:
    "premium-corp":
      requestsPerMinute: 1000
      burstSize: 200

routing:
  defaultBackend: "agent-sandbox"
  strategy: "template-based"
  strategies:
    - name: "tenant-static"
      rules:
        - tenant: "acme-corp"
          backend: "agent-sandbox"
        - tenant: "beta-users"
          backend: "e2b-cloud"
    - name: "template-routing"
      rules:
        - template: "code-interpreter"
          backend: "agent-sandbox"
        - template: "browser"
          backend: "opensandbox"
        - template: "desktop"
          backend: "e2b-cloud"
  # Health check
  healthCheck:
    interval: 10s
    timeout: 5s
    unhealthyThreshold: 3
    healthyThreshold: 2
  # Failover
  failover:
    enabled: true
    chain:
      - "agent-sandbox"
      - "e2b-cloud"

cache:
  backend: memory
  memory:
    maxSize: 1000
    defaultTTL: 30s
  redis:
    address: "redis:6379"
    defaultTTL: 60s

observability:
  otel:
    enabled: true
    serviceNamespace: "e2bgateway"
    endpoint: "http://otel-collector:4317"
    insecure: true
    samplingRatio: 0.1
  metrics:
    enabled: true
    path: "/metrics"
    prefix: "e2bgw"
  logging:
    level: "info"
    format: "json"
    auditLog: true
