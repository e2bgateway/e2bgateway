# Scaling: running more than one replica REQUIRES config.sessionStore.type
# set to redis (see below) — envd access tokens and the sandbox->backend
# routing map must be shared across replicas; with the default memory store
# each replica only knows its own state and cross-replica data-plane
# requests fail token validation (401). The same applies to autoscaling.
replicaCount: 1

image:
  repository: ghcr.io/e2bgateway/e2bgateway
  pullPolicy: IfNotPresent
  # Pin to a released tag in production; defaults to Chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# ClusterRole/ClusterRoleBinding for the agent-sandbox backend (sandbox,
# claim, template and warm pool CRDs + pod reads for envd endpoint
# resolution). Required for in-cluster operation.
rbac:
  create: true

# Prometheus scrape annotations (if your cluster discovers pods by annotation):
# podAnnotations:
#   prometheus.io/scrape: "true"
#   prometheus.io/port: "8080"
#   prometheus.io/path: "/metrics"
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  httpPort: 8080
  # 8443 is only served when config.server.https.{address,certFile,keyFile}
  # are all set (requires mounting a TLS secret).
  httpsPort: 8443

# NOTE: when E2B SDKs use host-based envd routing, requests arrive as
# {sandboxID}.<envdDomain> / {port}-{sandboxID}.<envdDomain>. An exact
# ingress host does NOT match its subdomains — for real SDK traffic add a
# wildcard host (e.g. "*.sandbox.example.com") with matching TLS coverage,
# in addition to wildcard DNS.
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: sandbox.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: sandbox-tls
  #    hosts:
  #      - sandbox.local
  #      - "*.sandbox.local"

# Deployment update strategy. Recreate is the safe default while gateway
# state (envd tokens, sandbox->backend map) is per-process in-memory:
# RollingUpdate would run old and new pods concurrently and split traffic
# between two disjoint token caches (#90). Trade-off: brief downtime during
# rollouts. Switch to RollingUpdate only once #90 is resolved.
strategy:
  type: Recreate

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  # Requires config.sessionStore.type: redis (shared envd tokens + routing
  # state) before enabling — see the replicaCount note above.
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70

# E2BGateway configuration (rendered verbatim into the ConfigMap).
# Key reference: configs/e2bgateway-example.yaml and the adapter factories
# (internal/adapter/*/factory.go).
config:
  server:
    http:
      address: "0.0.0.0:8080"
      readTimeout: 30s
      # Keep high: long-lived envd ConnectRPC streams flow through the
      # catch-all proxy route.
      writeTimeout: 300s
      idleTimeout: 120s
    # HTTPS is only served when address, certFile AND keyFile are all set.
    # https:
    #   address: "0.0.0.0:8443"
    #   certFile: "/etc/e2bgateway/certs/tls.crt"
    #   keyFile: "/etc/e2bgateway/certs/tls.key"
    # Base domain for envd host-based routing ({sandboxID}.<envdDomain>).
    # Set to your wildcard DNS / ingress host; without it only the
    # E2b-Sandbox-Id header path works.
    envdDomain: "sandbox.local"

  backends:
    # agent-sandbox: in-cluster only. Requires agent-sandbox v1.0.11 CRDs,
    # controller and sandbox-router installed (see NOTES.txt / chart README).
    - name: agent-sandbox
      type: agent-sandbox
      enabled: true
      config:
        namespace: sandbox-system
        # sandbox-router tunnel for cold-start CreateSandbox with envs:
        # gatewayName: "sandbox-router"
        # gatewayNamespace: "sandbox-system"
        # apiURL: "http://sandbox-router-svc.sandbox-system.svc.cluster.local"
        # Warm pool CRUD (SandboxWarmPool CRDs in the namespace above):
        # warmPoolUpdateStrategy: OnReplenish   # OnReplenish | Recreate
        # maxWarmPoolSize: 256
        # templateToWarmPool:
        #   code-interpreter: my-warm-pool
        # templateToSandboxTemplate:
        #   code-interpreter: my-sandbox-template
    - name: opensandbox
      type: opensandbox
      enabled: false
      config:
        # baseURL is REQUIRED (the legacy "endpoint" key is not read).
        baseURL: "http://opensandbox-controller.sandbox-system:8080"
        # apiKey: ""
        # false (default): gateway-generated tokens; true: OSEP-0011 signed
        # endpoints from the OpenSandbox server.
        useSignedEndpoint: false
        # templateToImage:
        #   code-interpreter: "registry.example.com/sandbox:latest"
        templateStore:
          type: memory              # memory | redis
          # addr: "redis:6379"      # only when type: redis
        warmPool:
          maxWarmPoolSize: 256
          # idleTimeout: 24h
          stateStore:
            type: memory            # memory | redis (redis survives restarts)
            # addr: "redis:6379"

  # Shared data-plane session store (envd access tokens + sandbox->backend
  # routing map). REQUIRED type: redis before running more than one replica:
  # with type: memory each replica only knows its own sandboxes and tokens
  # (cross-replica data-plane 401s; restarts lose all tokens). Redis must be
  # access-controlled; ANY non-loopback addr requires TLS (tls: true or a
  # rediss:// addr) regardless of password — the store carries envd bearer
  # tokens, so cleartext transport is rejected at startup.
  sessionStore:
    type: memory              # memory | redis
    # addr: "redis:6379"      # required when type: redis
    # password: ""
    # tls: false
    # db: 0
    # keyPrefix: "e2bgw:session:"
    # routingTTL: 24h         # sandbox->backend entry TTL, refreshed on read

  auth:
    providers:
      # API-key auth. Either inline `keys` (dev/testing only) or `secretRef`
      # pointing at a JSON file — on Kubernetes, mount a Secret via
      # `existingSecret` below. Setting both is a startup error.
      - type: apikey
        keys:
          - "test-key"
      # Production example (requires existingSecret: e2bgw-api-keys):
      # - type: apikey
      #   secretRef: /etc/e2bgateway/auth/keys.json
      #   headerName: X-API-Key
      # Optional static-JWKS JWT provider (jwksURL is NOT supported).
      # - type: jwt
      #   issuer: "https://auth.example.com"
      #   audience: "e2bgateway"
      #   clockSkew: 5s
      #   jwks: '{"keys":[{"kty":"RSA","kid":"your-key-id","alg":"RS256","use":"sig","n":"PUBLIC_BASE64URL_MODULUS","e":"AQAB"}]}'

  rateLimit:
    enabled: false

  routing:
    defaultBackend: agent-sandbox
    # One of: static | template-based | weighted | priority
    strategy: static

  observability:
    otel:
      enabled: false
    # Gateway self-metrics (Prometheus, pull-based). Served on the main HTTP
    # port — there is no separate metrics port.
    metrics:
      enabled: true
      # NOTE: auth/rate-limit/audit exemptions match the literal "/metrics"
      # path; keep the default unless you also adjust middleware constants.
      path: /metrics
      # Prometheus namespace for all metrics, e.g. e2bgw_http_requests_total.
      prefix: e2bgw
    logging:
      level: info
      format: json

# Existing Secret with API keys, mounted read-only at /etc/e2bgateway/auth.
# The Secret must contain a `keys.json` data key whose value is a JSON object
# mapping API key -> {"tenantID": "...", "apiKeyID": "...", "scopes": [...],
# "metadata": {...}} (tenantID required; scopes default to none). Then set
# auth.providers[].secretRef to /etc/e2bgateway/auth/keys.json.
# Key rotation: kubelet syncs the mount; restart the gateway to reload.
existingSecret: ""

nodeSelector: {}
tolerations: []
affinity: {}
