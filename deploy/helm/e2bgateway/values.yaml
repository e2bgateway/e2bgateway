replicaCount: 3

image:
  repository: ghcr.io/e2bgateway/e2bgateway
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  httpPort: 8080
  httpsPort: 8443
  metricsPort: 9090

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: sandbox.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: sandbox-tls
  #    hosts:
  #      - sandbox.local

# Port Forwarding Configuration
# Port forwarding allows access to services running inside sandboxes.
# The gateway provides APIs to list open ports and get access URLs.
# API Endpoints:
#   - GET /sandboxes/{id}/ports - List open ports in a sandbox
#   - GET /sandboxes/{id}/ports/{port} - Get URL for a specific port
# Note: Port forwarding is automatically enabled when backends support it.
# Both agent-sandbox and opensandbox backends now support port forwarding.
portForwarding:
  enabled: true
  # Port range for tracking (optional, for documentation purposes)
  # Actual port availability depends on the backend and sandbox configuration
  commonPorts:
    - 3000  # Web applications
    - 8080  # HTTP servers
    - 8888  # Jupyter notebooks

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

# E2BGateway configuration
config:
  server:
    http:
      address: "0.0.0.0:8080"
      readTimeout: 30s
      writeTimeout: 30s
      idleTimeout: 120s

  backends:
    - name: agent-sandbox
      type: agent-sandbox
      enabled: true
      config:
        namespace: sandbox-system
        defaultTemplate: code-interpreter
    - name: opensandbox
      type: opensandbox
      enabled: false
      config:
        endpoint: "http://opensandbox-controller.sandbox-system:8080"

  auth:
    methods:
      - type: apikey
        keys:
          - "test-key"

  rateLimit:
    enabled: false

  routing:
    defaultBackend: agent-sandbox
    strategy: round-robin

  observability:
    otel:
      enabled: false
    metrics:
      enabled: true
      path: /metrics
    logging:
      level: info
      format: json

# Existing secret with API keys
existingSecret: ""

nodeSelector: {}
tolerations: []
affinity: {}
