apiVersion: v1
kind: Service
metadata:
  name: {{ include "e2bgateway.fullname" . }}
  labels:
    {{- include "e2bgateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.service.httpsPort }}
    # Only served when config.server.https is configured.
    - port: {{ .Values.service.httpsPort }}
      targetPort: https
      protocol: TCP
      name: https
    {{- end }}
  selector:
    {{- include "e2bgateway.selectorLabels" . | nindent 4 }}
