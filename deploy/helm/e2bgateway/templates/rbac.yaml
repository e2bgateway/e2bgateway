{{- if .Values.rbac.create -}}
{{- $logNamespaces := dict -}}
{{- range .Values.config.backends -}}
  {{- /* Viper lowercases keys when it loads the gateway config. */ -}}
  {{- $backend := dict -}}
  {{- range $key, $value := . -}}
    {{- $_ := set $backend (lower $key) $value -}}
  {{- end -}}
  {{- $backendType := toString (get $backend "type") -}}
  {{- $enabled := get $backend "enabled" -}}
  {{- $enabledKind := kindOf $enabled -}}
  {{- $enabledString := toString $enabled -}}
  {{- $numericKinds := list "int" "int8" "int16" "int32" "int64" "uint" "uint8" "uint16" "uint32" "uint64" "float32" "float64" -}}
  {{- $enabledNumeric := has $enabledKind $numericKinds -}}
  {{- if and (eq $backendType "agent-sandbox") (or (and (eq $enabledKind "bool") (eq $enabledString "true")) (and (eq $enabledKind "string") (has $enabledString (list "true" "True" "TRUE" "t" "T" "1"))) (and $enabledNumeric (ne (float64 $enabled) (float64 0)))) -}}
    {{- $backendConfig := get $backend "config" -}}
    {{- $namespaceValue := "" -}}
    {{- if kindIs "map" $backendConfig -}}
      {{- range $key, $value := $backendConfig -}}
        {{- if eq (lower $key) "namespace" -}}
          {{- $namespaceValue = $value -}}
        {{- end -}}
      {{- end -}}
    {{- end -}}
    {{- $namespace := "default" -}}
    {{- if kindIs "string" $namespaceValue -}}
      {{- $namespace = default "default" $namespaceValue -}}
    {{- end -}}
    {{- $_ := set $logNamespaces $namespace true -}}
  {{- end -}}
{{- end -}}
# Minimal RBAC for the agent-sandbox backend (in-cluster SDK client + envd
# endpoint resolution). Adjust verbs/resources if features are disabled.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "e2bgateway.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "e2bgateway.labels" . | nindent 4 }}
rules:
  # Sandbox lifecycle (agent-sandbox core CRD).
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Claim lifecycle, template CRUD/builds, warm pool CRUD.
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims", "sandboxtemplates", "sandboxwarmpools"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # envd endpoint and port-forwarding URL resolution read pod IPs; sandboxes
  # may live in namespaces other than the gateway's.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "e2bgateway.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "e2bgateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "e2bgateway.fullname" . }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "e2bgateway.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{ range $namespace := keys $logNamespaces | sortAlpha }}
{{- $roleName := printf "%s-sandbox-logs-%s" (include "e2bgateway.fullname" $ | trunc 38 | trimSuffix "-") (sha256sum (printf "%s/%s/%s" (include "e2bgateway.fullname" $) $.Release.Namespace $namespace) | trunc 8) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $roleName }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "e2bgateway.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $roleName }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "e2bgateway.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleName }}
subjects:
  - kind: ServiceAccount
    name: {{ include "e2bgateway.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
