apiVersion: v1
kind: Service
metadata:
  name: e2bgateway
  labels:
    app.kubernetes.io/name: e2bgateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: e2bgateway
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
    - port: 8443
      targetPort: https
      protocol: TCP
      name: https
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: e2bgateway
    app.kubernetes.io/component: gateway
