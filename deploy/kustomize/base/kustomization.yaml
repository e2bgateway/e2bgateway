apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: e2bgateway-system

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - serviceaccount.yaml
  - configmap.yaml

labels:
  - pairs:
      app.kubernetes.io/name: e2bgateway
      app.kubernetes.io/part-of: e2bgateway
    includeSelectors: false
