apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2bgateway
  labels:
    app.kubernetes.io/name: e2bgateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: e2bgateway
spec:
  # Keep 1 replica unless sessionStore.type: redis is set in the configmap
  # (shared envd tokens + sandbox->backend routing). With redis configured,
  # raising replicas and switching to RollingUpdate are both safe.
  replicas: 1
  # Recreate: with the default in-memory sessionStore, RollingUpdate would
  # overlap old/new pods with disjoint token state and cause nondeterministic
  # data-plane 401s. Switch to RollingUpdate together with redis.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: e2bgateway
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e2bgateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: e2bgateway
      annotations:
        kustomize.config.k8s.io/config-checksum: placeholder
    spec:
      serviceAccountName: e2bgateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: e2bgateway
          image: ghcr.io/e2bgateway/e2bgateway:latest
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --config
            - /etc/e2bgateway/config.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            # 8443 is only served when server.https.{address,certFile,keyFile}
            # are configured in the ConfigMap (see configmap.yaml).
            - name: https
              containerPort: 8443
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/e2bgateway
              readOnly: true
            # Requires the Secret volume below and
            # secretRef: /etc/e2bgateway/auth/keys.json in the configmap.
            # - name: api-keys
            #   mountPath: /etc/e2bgateway/auth
            #   readOnly: true
      volumes:
        - name: config
          configMap:
            name: e2bgateway-config
        # Secret data key `keys.json`: JSON object mapping API key ->
        # {"tenantID", "apiKeyID", "scopes", "metadata"} (tenantID required).
        # - name: api-keys
        #   secret:
        #     secretName: e2bgw-api-keys
