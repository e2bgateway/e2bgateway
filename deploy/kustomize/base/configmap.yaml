apiVersion: v1
kind: ConfigMap
metadata:
  name: e2bgateway-config
  labels:
    app.kubernetes.io/name: e2bgateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: e2bgateway
data:
  config.yaml: |
    server:
      http:
        address: "0.0.0.0:8080"
        readTimeout: 30s
        writeTimeout: 300s
        idleTimeout: 120s

    backends:
      - name: agent-sandbox
        type: agent-sandbox
        enabled: true
        config:
          kubeconfig: ""
          namespace: "sandbox-system"
          sandboxClass: "default"
          defaultTemplate: "code-interpreter"
          timeout: 120s
      - name: opensandbox
        type: opensandbox
        enabled: false
        config:
          endpoint: "http://opensandbox-runtime:8080"
          timeout: 60s

    auth:
      providers:
        - type: apikey
          secretRef: "e2bgw-api-keys"
          headerName: "X-API-Key"

    rateLimit:
      enabled: true
      backend: memory
      defaultLimit:
        requestsPerMinute: 100
        burstSize: 20

    routing:
      defaultBackend: "agent-sandbox"
      strategy: "static"

    observability:
      otel:
        enabled: false
        endpoint: "http://otel-collector:4317"
        insecure: true
        samplingRatio: 1.0
      metrics:
        enabled: true
        path: "/metrics"
        prefix: "e2bgw"
      logging:
        level: "info"
        format: "json"
        auditLog: true
