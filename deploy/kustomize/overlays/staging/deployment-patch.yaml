apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2bgateway
spec:
  # Keep at 1 until sessionStore.type: redis is configured in the base
  # configmap; with the in-memory store, extra replicas break data-plane
  # token validation (401). With redis, scaling and RollingUpdate are safe.
  replicas: 1
  # Recreate: only required while the session store is in-memory (avoids
  # old/new pod overlap with disjoint token state; see production overlay).
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: e2bgateway
          env:
            - name: E2BGATEWAY_LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
