apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2bgateway
spec:
  # Keep at 1: envd token cache and sandbox->backend map are per-process
  # in-memory state; extra replicas break data-plane token validation (401).
  replicas: 1
  template:
    spec:
      containers:
        - name: e2bgateway
          env:
            - name: E2BGATEWAY_LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
