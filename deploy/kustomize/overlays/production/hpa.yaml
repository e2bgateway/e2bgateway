apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: e2bgateway
  labels:
    app.kubernetes.io/name: e2bgateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: e2bgateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: e2bgateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
