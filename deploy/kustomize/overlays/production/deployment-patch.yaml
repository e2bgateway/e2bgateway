apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2bgateway
  namespace: e2bgateway-system
spec:
  # Keep replicas at 1 until sessionStore.type: redis is configured in the
  # base configmap (shared envd access tokens + sandbox->backend routing).
  # Migrate in two steps: (1) enable redis while still at 1 replica +
  # Recreate — in-memory sessions do not survive that rollout, SDKs
  # re-fetch tokens; (2) only then raise replicas / re-enable the HPA.
  replicas: 1
  # Recreate (not the default RollingUpdate) is required while ANY replica
  # still uses the in-memory store: a surge pod overlapping an old pod would
  # serve traffic with disjoint token state (nondeterministic 401s). Switch
  # to RollingUpdate only after step (2) — never during the redis migration.
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: e2bgateway
          env:
            - name: E2BGATEWAY_LOG_LEVEL
              value: "warn"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: e2bgateway
                    app.kubernetes.io/component: gateway
                topologyKey: kubernetes.io/hostname
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: e2bgateway
                topologyKey: topology.kubernetes.io/zone
