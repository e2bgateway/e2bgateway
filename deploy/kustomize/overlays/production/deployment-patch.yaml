apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2bgateway
spec:
  # WARNING: keep replicas at 1. The envd access-token cache and the
  # sandbox->backend routing map are per-process in-memory state; with
  # multiple replicas, data-plane requests that land on a different replica
  # fail token validation (401). Scale out only after a shared token/state
  # store is available, or with session affinity AND acceptance that gateway
  # restarts invalidate tokens.
  # Tracking issue: https://github.com/e2bgateway/e2bgateway/issues/90
  replicas: 1
  # Recreate (not the default RollingUpdate): with in-memory token state, a
  # surge pod would serve traffic alongside the old pod with a disjoint token
  # cache, causing nondeterministic 401s on the envd data plane. Trade-off:
  # brief downtime during rollouts. Revisit when #90 is resolved.
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: e2bgateway
          env:
            - name: E2BGATEWAY_LOG_LEVEL
              value: "warn"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: e2bgateway
                    app.kubernetes.io/component: gateway
                topologyKey: kubernetes.io/hostname
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: e2bgateway
                topologyKey: topology.kubernetes.io/zone
