apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2bgateway
spec:
  # Keep replicas at 1 until sessionStore.type: redis is configured in the
  # base configmap (shared envd access tokens + sandbox->backend routing).
  # With redis, this overlay can safely raise replicas and re-enable the HPA.
  replicas: 1
  # Recreate (not the default RollingUpdate) is only required while the
  # session store is in-memory; with sessionStore.type: redis a surge pod
  # shares token state and RollingUpdate is safe. Trade-off until then:
  # brief downtime during rollouts.
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: e2bgateway
          env:
            - name: E2BGATEWAY_LOG_LEVEL
              value: "warn"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: e2bgateway
                    app.kubernetes.io/component: gateway
                topologyKey: kubernetes.io/hostname
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: e2bgateway
                topologyKey: topology.kubernetes.io/zone
