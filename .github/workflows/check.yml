name: check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Run golangci-lint
        run: golangci-lint run

      - name: go vet
        run: go vet ./...

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: OpenAPI drift check
        run: make openapi-check

      - name: Run tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: matrix.go == '1.26'
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Build binary
        run: make build

      - name: Verify binary
        run: |
          ./bin/e2bgateway version
          echo "Build successful"

  examples:
    name: Examples smoke (mock)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build Go examples
        run: go build ./examples/go/...

      - name: Install TypeScript compiler
        working-directory: examples/typescript
        run: npm ci --ignore-scripts

      - name: Compile TypeScript examples
        working-directory: examples/typescript
        run: npm run build

      - name: Run Go, Python, JavaScript, and TypeScript examples against a mock gateway
        run: python hack/examples-smoke.py --typescript
