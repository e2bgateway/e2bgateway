name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Set version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
          )
          mkdir -p dist
          for platform in "${PLATFORMS[@]}"; do
            GOOS=${platform%/*}
            GOARCH=${platform#*/}
            OUTPUT="dist/e2bgateway-${GOOS}-${GOARCH}"
            echo "Building $OUTPUT..."
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH \
              go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -o "$OUTPUT" ./cmd/e2bgateway
          done

      - name: Create archives
        run: |
          cd dist
          for binary in e2bgateway-*; do
            tar -czf "${binary}.tar.gz" "$binary"
            sha256sum "$binary" > "${binary}.sha256"
          done
          rm -f e2bgateway-*[^.]tar.gz e2bgateway-*[^.]sha256
          ls -la

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges > /tmp/changelog.md
          else
            git log --pretty=format:"- %s (%h)" --no-merges -20 > /tmp/changelog.md
          fi
          echo "changelog_file=/tmp/changelog.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.changelog.outputs.changelog_file }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  docker:
    name: Docker Images
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build metadata
        id: buildmeta
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: E2BGateway image metadata
        id: gateway_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha

      - name: Build and push E2BGateway image
        id: gateway_build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.gateway_meta.outputs.tags }}
          labels: ${{ steps.gateway_meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.buildmeta.outputs.BUILD_DATE }}
            GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha,scope=e2bgateway
          cache-to: type=gha,mode=max,scope=e2bgateway

      - name: Sandbox image metadata
        id: sandbox_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/sandbox-base
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha

      - name: Build and push Sandbox image
        id: sandbox_build
        uses: docker/build-push-action@v7
        with:
          context: images/sandbox
          file: images/sandbox/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.sandbox_meta.outputs.tags }}
          labels: ${{ steps.sandbox_meta.outputs.labels }}
          cache-from: type=gha,scope=sandbox-base
          cache-to: type=gha,mode=max,scope=sandbox-base

      - name: SBOM — E2BGateway image (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.gateway_build.outputs.digest }}
          format: spdx-json
          output-file: dist-sbom/e2bgateway_${{ github.ref_name }}_sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM — sandbox-base image (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/sandbox-base@${{ steps.sandbox_build.outputs.digest }}
          format: spdx-json
          output-file: dist-sbom/sandbox-base_${{ github.ref_name }}_sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless (Fulcio/Rekor) signing by digest covers the whole manifest
      # list, i.e. every architecture, with one signature per image.
      - name: Sign images (keyless)
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.gateway_build.outputs.digest }}"
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/sandbox-base@${{ steps.sandbox_build.outputs.digest }}"

      - name: Attach SBOMs to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist-sbom/*.spdx.json
          fail_on_unmatched_files: true

  helm-chart:
    name: Helm Chart
    runs-on: ubuntu-latest
    # `docker` is a hard dependency: the chart's default image tag follows
    # appVersion, so the chart must never reach GHCR before the images it
    # references are published.
    needs: [release, docker]
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.17.0

      - name: Set version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Fail fast on metadata drift instead of publishing a chart whose
      # version (and default image tag, which follows appVersion) disagrees
      # with the release tag.
      - name: Verify chart version matches tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHART_VERSION=$(helm show chart deploy/helm/e2bgateway | awk -F': ' '$1=="version"{print $2}')
          CHART_APP_VERSION=$(helm show chart deploy/helm/e2bgateway | awk -F': ' '$1=="appVersion"{gsub(/"/,"",$2); print $2}')
          if [ "$CHART_VERSION" != "$VERSION" ]; then
            echo "::error::Chart.yaml version '$CHART_VERSION' does not match tag version '$VERSION'"
            exit 1
          fi
          if [ "$CHART_APP_VERSION" != "$VERSION" ]; then
            echo "::error::Chart.yaml appVersion '$CHART_APP_VERSION' does not match tag version '$VERSION'"
            exit 1
          fi
          echo "Chart version and appVersion match $VERSION"

      - name: Lint and package chart
        run: |
          set -euo pipefail
          helm lint deploy/helm/e2bgateway
          helm package deploy/helm/e2bgateway --destination dist-chart
          ls -la dist-chart

      - name: Login to GHCR (helm)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR (OCI)
        run: helm push "dist-chart/e2bgateway-${{ steps.version.outputs.VERSION }}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

      # Appends the packaged chart to the release created by the `release` job
      # (same tag), so binaries, images and chart ship together.
      - name: Attach chart to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist-chart/*.tgz
          fail_on_unmatched_files: true
