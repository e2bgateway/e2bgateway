name: e2e

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # agent-sandbox backend E2E
  # ──────────────────────────────────────────────────────────────────────
  e2e-agent-sandbox:
    name: E2E (agent-sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -Lo ./kubectl "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.17.0

      - name: Create kind cluster
        run: |
          cat <<EOF | kind create cluster --name e2bgateway-e2e-asbx --config=-
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          name: e2bgateway-e2e-asbx
          nodes:
            - role: control-plane
              extraPortMappings:
                - containerPort: 30080
                  hostPort: 8080
          EOF

      - name: Build e2bgateway image
        run: |
          docker build -t e2bgateway:local .
          kind load docker-image e2bgateway:local --name e2bgateway-e2e-asbx

      - name: Build envd-embedded sandbox image
        run: |
          # Build sandbox image with envd daemon embedded (for E2B SDK ConnectRPC compatibility)
          docker build -t sandbox-with-envd:local -f images/sandbox/Dockerfile images/sandbox/
          kind load docker-image sandbox-with-envd:local --name e2bgateway-e2e-asbx

      - name: Deploy agent-sandbox controller
        run: |
          AGENT_SANDBOX_VERSION=v1.0.2

          # Install CRDs
          kubectl apply -f "https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/${AGENT_SANDBOX_VERSION}/k8s/crds/agents.x-k8s.io_sandboxes.yaml"
          kubectl apply -f "https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/${AGENT_SANDBOX_VERSION}/k8s/crds/extensions.agents.x-k8s.io_sandboxclaims.yaml"
          kubectl apply -f "https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/${AGENT_SANDBOX_VERSION}/k8s/crds/extensions.agents.x-k8s.io_sandboxtemplates.yaml"
          kubectl apply -f "https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/${AGENT_SANDBOX_VERSION}/k8s/crds/extensions.agents.x-k8s.io_sandboxwarmpools.yaml"

          # Deploy controller (patch image to use a real image instead of ko:// placeholder)
          kubectl apply -f "https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/${AGENT_SANDBOX_VERSION}/k8s/controller.yaml"
          kubectl apply -f "https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/${AGENT_SANDBOX_VERSION}/k8s/extensions.controller.yaml"
          kubectl apply -f "https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/${AGENT_SANDBOX_VERSION}/k8s/rbac.generated.yaml"
          kubectl apply -f "https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/${AGENT_SANDBOX_VERSION}/k8s/extensions-rbac.generated.yaml"

          # Patch controller deployment to use a real image
          # The controller.yaml uses ko:// placeholder which doesn't work in kind
          # We'll use the image from the agent-sandbox releases
          kubectl patch deployment agent-sandbox-controller -n agent-sandbox-system --type='json' -p='[
            {
              "op": "replace",
              "path": "/spec/template/spec/containers/0/image",
              "value": "registry.k8s.io/agent-sandbox/agent-sandbox-controller:v1.0.2"
            }
          ]'

          # Add ClusterRoleBinding for extensions API group
          # The controller needs permissions to manage sandboxclaims, sandboxtemplates, sandboxwarmpools
          cat <<'RBAC' | kubectl apply -f -
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: agent-sandbox-controller-extensions
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: agent-sandbox-controller-extensions
          subjects:
          - kind: ServiceAccount
            name: agent-sandbox-controller
            namespace: agent-sandbox-system
          RBAC

          kubectl create namespace agent-sandbox-system --dry-run=client -o yaml | kubectl apply -f -
          kubectl wait --for=condition=available deployment -n agent-sandbox-system --all --timeout=180s || true
          kubectl get pods -n agent-sandbox-system

      - name: Deploy sandbox-router
        run: |
          # The agent-sandbox Go client uses tunnelStrategy which requires a sandbox-router-svc
          # Service with ready endpoints. Deploy the Go router from the agent-sandbox project.
          # The router image is not yet promoted to registry.k8s.io, so use the staging registry.
          cat <<'ENDOFYAML' | kubectl apply -f -
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: sandbox-router
            namespace: agent-sandbox-system
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: sandbox-router-svc
            namespace: agent-sandbox-system
          spec:
            type: ClusterIP
            selector:
              app.kubernetes.io/name: sandbox-router
              app.kubernetes.io/component: sandbox-router
            ports:
            - name: proxy
              port: 8080
              targetPort: 8080
              protocol: TCP
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: sandbox-router
            namespace: agent-sandbox-system
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: sandbox-router
                app.kubernetes.io/component: sandbox-router
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: sandbox-router
                  app.kubernetes.io/component: sandbox-router
              spec:
                serviceAccountName: sandbox-router
                containers:
                - name: sandbox-router
                  image: us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox/sandbox-router-go:latest-main
                  args:
                  - --http-bind-address=:8080
                  - --metrics-bind-address=:9090
                  - --health-probe-bind-address=:8081
                  - --cluster-domain=cluster.local
                  - --proxy-timeout=180s
                  - --upstream-max-retries=3
                  - --cache-enabled=false
                  ports:
                  - name: proxy
                    containerPort: 8080
                  - name: healthz
                    containerPort: 8081
                  readinessProbe:
                    httpGet:
                      path: /readyz
                      port: 8081
                    initialDelaySeconds: 2
                    periodSeconds: 5
                  livenessProbe:
                    httpGet:
                      path: /healthz
                      port: 8081
                    initialDelaySeconds: 5
                    periodSeconds: 10
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                    limits:
                      cpu: 500m
                      memory: 256Mi
          ENDOFYAML

          kubectl wait --for=condition=available deployment/sandbox-router -n agent-sandbox-system --timeout=120s || true
          kubectl get pods,endpoints -n agent-sandbox-system

      - name: Create SandboxTemplate and WarmPool
        run: |
          cat <<'YAML' | kubectl apply -f -
          apiVersion: extensions.agents.x-k8s.io/v1beta1
          kind: SandboxTemplate
          metadata:
            name: base
            namespace: agent-sandbox-system
          spec:
            networkPolicyManagement: Unmanaged
            podTemplate:
              spec:
                containers:
                  - name: sandbox
                    image: sandbox-with-envd:local
                    imagePullPolicy: IfNotPresent
                    args: ["tail", "-f", "/dev/null"]
                    ports:
                      - containerPort: 49983
                        name: envd
                    # envd requires CAP_SYS_RESOURCE to write /proc/[pid]/oom_score_adj
                    # in its process wrapper script. Without privileged mode, commands
                    # fail with "I/O error" on stdout.
                    securityContext:
                      privileged: true
                    resources:
                      requests:
                        cpu: 100m
                        memory: 128Mi
                      limits:
                        cpu: 500m
                        memory: 512Mi
          ---
          apiVersion: extensions.agents.x-k8s.io/v1beta1
          kind: SandboxWarmPool
          metadata:
            name: base
            namespace: agent-sandbox-system
          spec:
            sandboxTemplateRef:
              name: base
            replicas: 2
          YAML

          # Wait for warm pool pods to be ready
          echo "Waiting for warm pool pods..."
          for i in $(seq 1 30); do
            READY=$(kubectl get sandboxwarmpool base -n agent-sandbox-system -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
            if [ "${READY}" = "2" ]; then
              echo "Warm pool has 2 ready replicas"
              break
            fi
            echo "  readyReplicas=${READY:-0} ($i)"
            sleep 2
          done
          kubectl get sandboxtemplates,sandboxwarmpools,pods -n agent-sandbox-system

      - name: Deploy e2bgateway
        run: |
          kubectl create namespace e2bgateway-system --dry-run=client -o yaml | kubectl apply -f -

          cat <<'YAML' | kubectl apply -f -
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: e2bgateway-config
            namespace: e2bgateway-system
          data:
            config.yaml: |
              server:
                http:
                  address: "0.0.0.0:8080"
                  readTimeout: 60s
                  writeTimeout: 300s
                  idleTimeout: 120s
                envdDomain: "localhost:8080"
              auth:
                providers:
                  - type: apikey
                    keys:
                      - "e2b_0000000000000000000000000000000000000000"
              rateLimit:
                enabled: false
              backends:
                - name: agent-sandbox
                  type: agent-sandbox
                  enabled: true
                  config:
                    namespace: agent-sandbox-system
                    warmPoolName: base
                    templateToWarmPool:
                      "base": "base"
              routing:
                defaultBackend: agent-sandbox
                strategy: static
              observability:
                logging:
                  level: debug
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: e2bgateway
            namespace: e2bgateway-system
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: e2bgateway
            template:
              metadata:
                labels:
                  app: e2bgateway
              spec:
                serviceAccountName: e2bgateway
                containers:
                  - name: e2bgateway
                    image: e2bgateway:local
                    imagePullPolicy: IfNotPresent
                    ports:
                      - containerPort: 8080
                    volumeMounts:
                      - name: config
                        mountPath: /etc/e2bgateway
                        readOnly: true
                    resources:
                      requests:
                        cpu: 100m
                        memory: 128Mi
                      limits:
                        cpu: 500m
                        memory: 256Mi
                volumes:
                  - name: config
                    configMap:
                      name: e2bgateway-config
          ---
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: e2bgateway
            namespace: e2bgateway-system
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: e2bgateway
          subjects:
            - kind: ServiceAccount
              name: e2bgateway
              namespace: e2bgateway-system
          roleRef:
            kind: ClusterRole
            name: cluster-admin
            apiGroup: rbac.authorization.k8s.io
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: e2bgateway
            namespace: e2bgateway-system
          spec:
            type: NodePort
            selector:
              app: e2bgateway
            ports:
              - port: 8080
                targetPort: 8080
                nodePort: 30080
          YAML

          kubectl wait --for=condition=available deployment/e2bgateway -n e2bgateway-system --timeout=120s

      - name: Run E2E tests
        run: |
          export GATEWAY_URL="http://localhost:8080"
          export E2B_API_KEY="e2b_0000000000000000000000000000000000000000"
          export E2B_DOMAIN="localhost:8080"
          # E2B SDK constructs envd URL as https://{port}-{sandboxID}.{domain} which
          # doesn't work in CI (no TLS, no wildcard DNS). Override with direct gateway URL.
          # The SDK sends E2b-Sandbox-Id header which the gateway's envd proxy uses for routing.
          export E2B_API_URL="http://localhost:8080"
          export E2B_SANDBOX_URL="http://localhost:8080"
          # Skip Python/JS SDK tests as they require HTTPS setup with proper certificates
          # and wildcard DNS that's not available in CI environment
          export SKIP_SDK_TESTS=1
          # The agent-sandbox adapter now uses the envd ConnectRPC client for data plane
          # operations (RunCommand, ExecuteCode, file ops, etc.), so curl-based data plane
          # tests work. The adapter discovers the sandbox pod IP via K8s API and connects
          # directly to envd on port 49983.

          # Port-forward gateway
          kubectl port-forward svc/e2bgateway -n e2bgateway-system 8080:8080 &
          PF_PID=$!
          sleep 5

          # Wait for gateway ready
          for i in $(seq 1 30); do
            if curl -sf "${GATEWAY_URL}/healthz" >/dev/null 2>&1; then
              echo "Gateway is ready"
              break
            fi
            echo "Waiting for gateway... ($i)"
            sleep 2
          done

          source "$(pwd)/hack/kind-e2e/run-examples-e2e.sh"

          AUTH_PROBE_STATUS=0
          bash "$(pwd)/test/e2e/test-auth-failures.sh" agent-sandbox || AUTH_PROBE_STATUS=$?

          kill $PF_PID 2>/dev/null
          [ "${FAILED:-0}" -eq 0 ] && [ "${AUTH_PROBE_STATUS}" -eq 0 ] || exit 1

      - name: Collect diagnostics
        if: always()
        run: |
          echo "=== Pods ==="
          kubectl get pods -A
          echo ""
          echo "=== Gateway logs ==="
          kubectl logs -n e2bgateway-system deployment/e2bgateway --tail=50 || true
          echo "=== Auth probe logs ==="
          kubectl logs -n e2bgateway-system deployment/e2bgateway-auth-probe --tail=50 || true
          echo ""
          echo "=== Agent-sandbox logs ==="
          kubectl logs -n agent-sandbox-system deployment/agent-sandbox-controller --tail=50 || true

      - name: Cleanup kind cluster
        if: always()
        run: |
          kind delete cluster --name e2bgateway-e2e-asbx || true

  # ──────────────────────────────────────────────────────────────────────
  # OpenSandbox backend E2E
  # ──────────────────────────────────────────────────────────────────────
  e2e-opensandbox:
    name: E2E (opensandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -Lo ./kubectl "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.17.0

      - name: Create kind cluster
        run: |
          cat <<EOF | kind create cluster --name e2bgateway-e2e-osbx --config=-
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          name: e2bgateway-e2e-osbx
          nodes:
            - role: control-plane
              extraPortMappings:
                - containerPort: 30080
                  hostPort: 8080
          EOF

      - name: Build e2bgateway image
        run: |
          docker build -t e2bgateway:local .
          kind load docker-image e2bgateway:local --name e2bgateway-e2e-osbx

      - name: Build envd-embedded sandbox image
        run: |
          # Build sandbox image with envd daemon embedded (for E2B SDK ConnectRPC compatibility)
          docker build -t sandbox-with-envd:local -f images/sandbox/Dockerfile images/sandbox/
          kind load docker-image sandbox-with-envd:local --name e2bgateway-e2e-osbx

      - name: Deploy OpenSandbox server (release-1.2.1, helm)
        run: |
          set -e
          # Charts are versioned sources in the upstream repo (not published
          # as tgz); clone the exact release tag and install the umbrella chart
          # (CRDs + controller + lifecycle server). Sandboxes run as Pods in
          # the "opensandbox" namespace via the kubernetes runtime.
          git clone --depth 1 --branch release-1.2.1 https://github.com/alibaba/OpenSandbox.git /tmp/opensandbox
          cd /tmp/opensandbox/manifests/charts
          helm dependency build opensandbox

          # Images pull straight from docker.io on the kind node
          # (values-e2e.yaml re-points the chart defaults away from the
          # slow-to-reach aliyun mirror). No `kind load` preloading: the
          # runner's containerd-backed image store trips kind's
          # --all-platforms ctr import (digest NotFound), and docker.io pulls
          # are fast on GitHub-hosted runners anyway.

          # Sandbox workload namespace — the chart does not create it.
          kubectl create namespace opensandbox --dry-run=client -o yaml | kubectl apply -f -
          # Release namespace: helm stores the release record here before
          # applying any manifest, so it must pre-exist; values-e2e.yaml sets
          # base.fastSandbox.namespaces.install=false so the chart does not
          # try to re-create (and fail to adopt) it.
          kubectl create namespace opensandbox-system --dry-run=client -o yaml | kubectl apply -f -

          helm install opensandbox opensandbox \
            --namespace opensandbox-system \
            -f "$GITHUB_WORKSPACE/test/kind-e2e/manifests/opensandbox/values-e2e.yaml" \
            --wait --timeout 5m
          kubectl -n opensandbox-system get pods

          # Probe the lifecycle API from the runner via a temporary port-forward.
          kubectl -n opensandbox-system port-forward svc/opensandbox-server 18090:80 >/tmp/pf.log 2>&1 &
          PF_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://localhost:18090/v1/sandboxes >/dev/null 2>&1; then
              echo "OpenSandbox server is ready"
              break
            fi
            echo "Waiting for opensandbox server... ($i)"
            sleep 2
          done
          curl -sf http://localhost:18090/v1/sandboxes >/dev/null || {
            echo "OpenSandbox server failed to come up:"
            kubectl -n opensandbox-system logs deploy/opensandbox-server --tail=100 || true
            kill $PF_PID 2>/dev/null || true
            exit 1
          }
          kill $PF_PID 2>/dev/null || true

      - name: Deploy e2bgateway
        run: |
          kubectl create namespace e2bgateway-system --dry-run=client -o yaml | kubectl apply -f -

          cat <<'YAML' | kubectl apply -f -
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: e2bgateway-config
            namespace: e2bgateway-system
          data:
            config.yaml: |
              server:
                http:
                  address: "0.0.0.0:8080"
                  readTimeout: 60s
                  writeTimeout: 300s
                  idleTimeout: 120s
                envdDomain: "localhost:8080"
              auth:
                providers:
                  - type: apikey
                    keys:
                      - "e2b_0000000000000000000000000000000000000000"
              rateLimit:
                enabled: false
              backends:
                - name: opensandbox
                  type: opensandbox
                  enabled: true
                  config:
                    baseURL: "http://opensandbox-server.opensandbox-system/v1"
                    templateToImage:
                      "base": "sandbox-with-envd:local"
              routing:
                defaultBackend: opensandbox
                strategy: static
              observability:
                logging:
                  level: debug
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: e2bgateway
            namespace: e2bgateway-system
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: e2bgateway
            template:
              metadata:
                labels:
                  app: e2bgateway
              spec:
                serviceAccountName: e2bgateway
                containers:
                  - name: e2bgateway
                    image: e2bgateway:local
                    imagePullPolicy: IfNotPresent
                    ports:
                      - containerPort: 8080
                    volumeMounts:
                      - name: config
                        mountPath: /etc/e2bgateway
                        readOnly: true
                    resources:
                      requests:
                        cpu: 100m
                        memory: 128Mi
                      limits:
                        cpu: 500m
                        memory: 256Mi
                volumes:
                  - name: config
                    configMap:
                      name: e2bgateway-config
          ---
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: e2bgateway
            namespace: e2bgateway-system
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: e2bgateway
          subjects:
            - kind: ServiceAccount
              name: e2bgateway
              namespace: e2bgateway-system
          roleRef:
            kind: ClusterRole
            name: cluster-admin
            apiGroup: rbac.authorization.k8s.io
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: e2bgateway
            namespace: e2bgateway-system
          spec:
            type: NodePort
            selector:
              app: e2bgateway
            ports:
              - port: 8080
                targetPort: 8080
                nodePort: 30080
          YAML

          kubectl wait --for=condition=available deployment/e2bgateway -n e2bgateway-system --timeout=120s

      - name: Run E2E tests
        run: |
          export GATEWAY_URL="http://localhost:8080"
          export E2B_API_KEY="e2b_0000000000000000000000000000000000000000"
          export E2B_DOMAIN="localhost:8080"
          # E2B SDK constructs envd URL as https://{port}-{sandboxID}.{domain} which
          # doesn't work in CI (no TLS, no wildcard DNS). Override with direct gateway URL.
          # The SDK sends E2b-Sandbox-Id header which the gateway's envd proxy uses for routing.
          export E2B_API_URL="http://localhost:8080"
          export E2B_SANDBOX_URL="http://localhost:8080"
          # Skip Python/JS SDK tests as they require HTTPS setup with proper certificates
          # and wildcard DNS that's not available in CI environment
          export SKIP_SDK_TESTS=1
          export WARMPOOL_E2E=1

          # Port-forward gateway
          kubectl port-forward svc/e2bgateway -n e2bgateway-system 8080:8080 &
          PF_PID=$!
          sleep 5

          # Wait for gateway ready
          for i in $(seq 1 30); do
            if curl -sf "${GATEWAY_URL}/healthz" >/dev/null 2>&1; then
              echo "Gateway is ready"
              break
            fi
            echo "Waiting for gateway... ($i)"
            sleep 2
          done

          source "$(pwd)/hack/kind-e2e/run-examples-e2e.sh"

          AUTH_PROBE_STATUS=0
          bash "$(pwd)/test/e2e/test-auth-failures.sh" opensandbox || AUTH_PROBE_STATUS=$?

          kill $PF_PID 2>/dev/null
          [ "${FAILED:-0}" -eq 0 ] && [ "${AUTH_PROBE_STATUS}" -eq 0 ] || exit 1

      - name: Collect diagnostics
        if: always()
        run: |
          echo "=== Pods ==="
          kubectl get pods -A
          echo ""
          echo "=== Gateway logs ==="
          kubectl logs -n e2bgateway-system deployment/e2bgateway --tail=50 || true
          echo "=== Auth probe logs ==="
          kubectl logs -n e2bgateway-system deployment/e2bgateway-auth-probe --tail=50 || true
          echo ""
          echo "=== OpenSandbox server logs ==="
          kubectl logs -n opensandbox-system deploy/opensandbox-server --tail=100 || true
          echo "=== OpenSandbox controller logs ==="
          kubectl logs -n opensandbox-system deploy/opensandbox-controller-manager --tail=100 || true
          echo "=== Sandbox workload pods ==="
          kubectl get pods -n opensandbox -o wide || true

      - name: Cleanup kind cluster
        if: always()
        run: |
          kind delete cluster --name e2bgateway-e2e-osbx || true
